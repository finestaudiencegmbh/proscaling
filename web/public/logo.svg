<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Favicon-Markenzeichen. Für ein neues Projekt entweder diese Datei
       ersetzen ODER in config/project.config.json branding.logo auf einen
       eigenen Pfad setzen. Standard hier: Kürzel "PS" in CI-Farben. -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#000000" stroke="#cba851" stroke-width="4"/>
  <text x="50" y="52" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="44"
        letter-spacing="-1" fill="#cba851">PS</text>
</svg>
